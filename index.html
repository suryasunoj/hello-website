<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="background-glow"></div>
  
  <main class="container">
    <div class="card">
      <span class="badge">👋 Welcome</span>
      <h1 id="greeting">Hello!</h1>
      <p class="subtitle">Welcome to your new website. Simple, modern, and clean.</p>
      
      <div class="interactive-panel">
        <button id="change-greeting-btn" class="btn primary">Say Hello in Another Language</button>
      </div>

      <div class="language-counter">
        <span id="lang-name">English</span>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
